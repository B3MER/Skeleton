services:
    db:
        container_name: skeleton_db
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: skeleton_db
            POSTGRES_USER: sheimo
            POSTGRES_PASSWORD: "password123"
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U sheimo -d skeleton_db"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        container_name: skeleton_back
        network_mode: "host"
        build: ./backend
        restart: unless-stopped
        command:
            [
                "daphne",
                "-b",
                "0.0.0.0",
                "-p",
                "8008",
                "core.asgi:application",
            ]
        env_file: ./backend/.env
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8008:8008"
        volumes:
            - media_data:/app/media_files

volumes:
    pgdata:
    media_data:
